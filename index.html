<div class="sayfa-bas"><div><h1>Program ve Sınav Analizi</h1><p class="soluk">2026-2027 İngilizce 2-8. sınıf · araştırma özeti (20 Kasım 2026)</p></div></div>
<div class="iki-kolon"><div>
<div class="kart-kutu"><h2>1. Hangi sınıf hangi programda?</h2>
<table class="plan"><thead><tr><th>Sınıf</th><th>2026-27 programı</th><th>Haftalık saat</th><th>Yapı</th></tr></thead><tbody>
<tr><td>2</td><td>Maarif (TYMM) — 2. yılı</td><td>2</td><td>6 tema (School Life → Life in the City & the World)</td></tr>
<tr><td>3</td><td><b>Maarif — bu yıl başladı</b></td><td>2</td><td>6 tema; orientation + 2 hafta revision</td></tr>
<tr><td>4</td><td>2018 programı</td><td>2</td><td>10 ünite (Classroom Rules → Food and Drinks)</td></tr>
<tr><td>5</td><td>Maarif — 3. yılı</td><td>3</td><td>8 tema (School Life → Life in the Universe & Future)</td></tr>
<tr><td>6</td><td>Maarif — 2. yılı</td><td>3</td><td>8 tema</td></tr>
<tr><td>7</td><td>2018 programı</td><td>4</td><td>10 ünite (Appearance and Personality → Planets)</td></tr>
<tr><td>8</td><td>2018 programı (LGS)</td><td>4</td><td>10 ünite (Friendship → Natural Forces)</td></tr></tbody></table>
<p class="soluk">Kaynak: MEB “İngilizce (2-8. sınıf) taslak yıllık çerçeve plan” 2026-2027 (tymm.meb.gov.tr). 4, 7, 8. sınıfların Maarif temaları yayımlandı ama 2027-28'de uygulanacak; uygulama bunları “gelecek program” olarak saklar.</p></div>
<div class="kart-kutu"><h2>2. Maarif modelinin ders akışı</h2>
<p>Her tema aynı beceri ailelerini sırayla işler: <b>L</b> dinleme/izleme (hazırlık → genel anlam → ayrıntı → yansıtma), <b>P</b> telaffuz, <b>R</b> okuma, <b>V</b> kelime, <b>G</b> dil bilgisi (kalıp/“chunk”), <b>W</b> yazma (kopyala → modelden üret → yapılandır → paylaş → yansıt), <b>S</b> konuşma. Kod biçimi <code>ENG.5.2.V1</code> = 5. sınıf, 2. tema, kelime çıktısı.</p>
<ul><li>Giriş metni çoğunlukla <b>dijital hikâye</b>: önce durmadan, sonra durdurarak izlenir.</li>
<li>Dil bilgisi <b>kural anlatmadan</b>, kalıplarla ve örneklerden keşfettirilerek verilir (2-3. sınıfta tamamen “chunk”).</li>
<li>Önerilen teknikler: TPR, gölge okuma, koro, fısıltı zinciri, piramit/radyo okuma, Bingo, Pelmanism, King's Game, Odd One Out, resim sözlüğü, show and tell.</li>
<li>Her temanın sonunda <b>performans görevi</b> (ör. 5. sınıf “dream classroom” posteri, 8. sınıf okul etkinliği önerisi) ve dereceli puanlama.</li>
<li>Her temada <b>farklılaştırma</b>: zenginleştirme + destekleme etkinliği.</li></ul>
<p>Uygulama bu akışı 6 aşamaya böler: 🔍 Keşif → 🔤 Kelime → 🧩 Kalıp → 👂 Okuma-Dinleme → 🗣️ Konuşma → ✍️ Yazma & Görev; temanın hafta sayısına göre dağıtır.</p></div>
</div><div>
<div class="kart-kutu"><h2>3. Sınav sistemi</h2>
<ul><li><b>Ortak Yazılı Sınav Sistemi (OYSS)</b> 2026-27'de ortaokul 5, 6, 7. sınıflarda İngilizceyi kapsıyor (okul geneli). MEB her dönem için 5 senaryoluk konu-soru dağılım tablosu yayımlıyor; zümre birini seçiyor.</li>
<li>Tablolarda yalnız <b>R (okuma), V (kelime), G (dil bilgisi), W (yazma)</b> çıktıları var; dinleme ve konuşma yazılıda ölçülmüyor → derste performans ve gözlemle değerlendirilmeli.</li>
<li>Ülke geneli ortak sınavlarda İngilizce yok (6-7 matematik/Türkçe). Ülke geneli takvim: 5-6 Ocak, 6-7 Nisan, 8-9 Haziran 2027.</li>
<li><b>LGS</b>: sistem değişmedi; sözel oturumda 10 İngilizce sorusu. 8. sınıf İngilizce programı değişmedi.</li></ul></div>
<div class="kart-kutu"><h2>4. Bu uygulamada neler var?</h2>
<ul><li>MEB yıllık planı (37 hafta), tema içerikleri, farklılaştırma ve performans görevleri — resmî metinden otomatik.</li>
<li>Her ünite için ≤10 konuşma kelimesi, 1 cümle kalıbı + 5 örnek, yabancı arkadaşla 4 adımlık sohbet (✦ Claude).</li>
<li>Haftalık plan, sınıf saatine göre günlük plan (40 dk, MEB tablosu biçimi, Word'e aktarılır).</li>
<li>11 tahta oyunu; düellolar: Halat Çekme, 1 Dakika Kelime, Harf Avı.</li>
<li>Öğrenci uygulaması: haftalık görev, aralıklı tekrar (Leitner), düellolar, rapor kodu / sunucu senkronu.</li>
<li>Ücretsiz platform bağlantıları (Eğitimhane, Wordwall, İngilizceciyiz, Liveworksheets…) — içerik sahiplerine ait olduğu için kopyalanmaz, bağlantı verilir.</li></ul></div>
